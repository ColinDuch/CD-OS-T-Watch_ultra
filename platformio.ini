[env:twatch_ultra]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

; --- Réglages repris de la définition officielle (boards.txt, "twatch_ultra") ---
board_upload.flash_size = 16MB
board_build.flash_mode = dio                       ; flash lue sur 2 fils, comme le veut LilyGo
board_build.arduino.memory_type = qio_qspi         ; PSRAM externe en quad
board_build.variant = lilygo_twatch_ultra          ; brochage de la montre (SDA, SCL...)
board_build.partitions = app3M_fat9M_16MB.csv      ; 3 MB programme + 9,9 MB fichiers

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_T_WATCH_S3_ULTRA
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1